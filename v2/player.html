<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>

    <link rel="stylesheet" href="player.css">
</head>
<body>
    
    <h3 class="heading">Video Player</h3>

    <div class="container">

        <div class="main-video">
            <div class="video">
                <video src="assets/videos/balcony_view.mp4" controls muted autoplay></video>
                <h3 class="title">Balcony View</h3>
            </div>
        </div>
        
        <div class="video-list">
            <div class="vid active">
                <video src="assets/videos/balcony_view.mp4" muted></video>
                <h3 class="title">Balcony View</h3>
            </div>
            <div class="vid">
                <video src="assets/videos/exterior_work.mp4" muted></video>
                <h3 class="title">Exterior Work</h3>
            </div>
            <div class="vid">
                <video src="assets/videos/finished_exterior_2.mp4" muted></video>
                <h3 class="title">Finished Exterior 2</h3>
            </div>
            <div class="vid">
                <video src="assets/videos/finished_exterior_3.mp4" muted></video>
                <h3 class="title">Finished Exterior 3</h3>
            </div>
            <div class="vid">
                <video src="assets/videos/metal_gate_showcase.mp4" muted></video>
                <h3 class="title">Metal Gate Showcase</h3>
            </div>
            <div class="vid">
                <video src="assets/videos/roof_work.mp4" muted></video>
                <h3 class="title">Roof Work</h3>
            </div>
            <div class="vid">
                <video src="assets/videos/sliding_door.mp4" muted></video>
                <h3 class="title">Sliding Door</h3>
            </div>
            <div class="vid">
                <video src="assets/videos/stylish_door.mp4" muted></video>
                <h3 class="title">Stylish Door</h3>
            </div>
            <div class="vid">
                <video src="assets/videos/stylish_gate_2.mp4" muted></video>
                <h3 class="title">Stylish Gate 2</h3>
            </div>
            <div class="vid">
                <video src="assets/videos/stylish_gate_3.mp4" muted></video>
                <h3 class="title">Stylish Gate 3</h3>
            </div>
        </div>
    </div>

    <script src="player.js"></script>
</body>
</html>
